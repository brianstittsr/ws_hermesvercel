# APGM-specific deployment for EasyPanel
# This is a standalone configuration for APGM customer
#
# ⚠️ IMPORTANT SETUP REQUIRED ⚠️
#
# Before deploying in EasyPanel, you MUST build and push the Hermes image to GitHub Container Registry:
#
# Step 1: Build the image locally from this repository:
#   docker build -t ghcr.io/brianstittsr/ws_hermesvercel:latest ./hermes-agent
#
# Step 2: Login to GitHub Container Registry (if not already logged in):
#   echo YOUR_GITHUB_TOKEN | docker login ghcr.io -u brianstittsr --password-stdin
#
# Step 3: Push to GitHub Container Registry:
#   docker push ghcr.io/brianstittsr/ws_hermesvercel:latest
#
# Step 4: Deploy this docker-compose.yml in EasyPanel
#
# Note: The image name below is already configured for your GitHub registry.
# Just make sure you've pushed the image before deploying.

services:
  gateway:
    image: ghcr.io/brianstittsr/ws_hermesvercel:latest
    restart: unless-stopped
    user: "10000:10000"
    group_add:
      - "998"
    volumes:
      - hermes-apgm-data:/opt/data
      - hermes-apgm-home:/home/hermes
      - /var/run/docker.sock:/var/run/docker.sock
      - ./docker-entrypoint.sh:/docker-entrypoint.sh:ro
    environment:
      - HERMES_UID=10000
      - HERMES_GID=10000
      - HERMES_HOME=/home/hermes
      - GATEWAY_ALLOW_ALL_USERS=true
      - CUSTOMER_NAME=apgm
      - TELEGRAM_BOT_TOKEN=8602404841:AAHoq9ZmaVC10rDLlXNCvDgyrbpQygs9Yss
    entrypoint: ["bash", "/docker-entrypoint.sh"]
    command: ["hermes", "gateway", "run"]
    networks:
      - hermes-apgm-network

  dashboard:
    image: ghcr.io/brianstittsr/ws_hermesvercel:latest
    restart: unless-stopped
    user: "10000:10000"
    group_add:
      - "998"
    depends_on:
      - gateway
    ports:
      - "9121:9121"
    volumes:
      - hermes-apgm-data:/opt/data
      - hermes-apgm-home:/home/hermes
      - /var/run/docker.sock:/var/run/docker.sock
      - ./docker-entrypoint.sh:/docker-entrypoint.sh:ro
    environment:
      - HERMES_UID=10000
      - HERMES_GID=10000
      - HERMES_HOME=/home/hermes
      - CUSTOMER_NAME=apgm
      - GATEWAY_URL=http://gateway:8000
    entrypoint: ["bash", "/docker-entrypoint.sh"]
    command: ["hermes", "dashboard", "--host", "0.0.0.0", "--port", "9121", "--no-open", "--insecure"]
    networks:
      - hermes-apgm-network

networks:
  hermes-apgm-network:
    driver: bridge
    name: hermes-apgm-network

volumes:
  hermes-apgm-data:
    name: hermes-apgm-data
  hermes-apgm-home:
    name: hermes-apgm-home
