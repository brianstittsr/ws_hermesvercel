services:
  gateway:
    build:
      context: ./hermes-agent
      dockerfile: Dockerfile
    restart: unless-stopped
    user: "10000:10000"
    group_add:
      - "${DOCKER_GID:-998}"
    volumes:
      - hermes-data:/opt/data
      - hermes-home:/home/hermes
      - /var/run/docker.sock:/var/run/docker.sock
      - ./docker-entrypoint.sh:/docker-entrypoint.sh:ro
    environment:
      - HERMES_UID=10000
      - HERMES_GID=10000
      - HERMES_HOME=/home/hermes
      - GATEWAY_ALLOW_ALL_USERS=true
    entrypoint: ["bash", "/docker-entrypoint.sh"]
    command: ["hermes", "gateway", "run"]
    networks:
      - hermes-net

  dashboard:
    build:
      context: ./hermes-agent
      dockerfile: Dockerfile
    restart: unless-stopped
    user: "10000:10000"
    group_add:
      - "${DOCKER_GID:-998}"
    depends_on:
      - gateway
    ports:
      - "9120:9120"
    volumes:
      - hermes-data:/opt/data
      - hermes-home:/home/hermes
      - /var/run/docker.sock:/var/run/docker.sock
      - ./docker-entrypoint.sh:/docker-entrypoint.sh:ro
    environment:
      - HERMES_UID=10000
      - HERMES_GID=10000
      - HERMES_HOME=/home/hermes
      - GATEWAY_URL=http://gateway:8000
    entrypoint: ["bash", "/docker-entrypoint.sh"]
    command: ["hermes", "dashboard", "--host", "0.0.0.0", "--port", "9120", "--no-open", "--insecure"]
    networks:
      - hermes-net

volumes:
  hermes-data:
  hermes-home:

networks:
  hermes-net:
